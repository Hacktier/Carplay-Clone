<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Auto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto">
<meta name="theme-color" content="#0C0F13">
<link rel="manifest" href="manifest.json">
<style>
  /* ================================================================
     NACHTFAHRT — ein Instrumenten-Cluster, kein Web-Dashboard.
     Warmes Graphit als Gehäuse, Natriumdampf-Bernstein als einzige
     Leuchtfarbe. Signatur: die Bernsteinlinie als Tankanzeige, die
     unter der ganzen Transportleiste durchläuft und leicht glüht.
     ================================================================ */
  :root{
    --ink:      #0C0F13;
    --ink-2:    #11161C;
    --panel:    #161C22;
    --panel-hi: #1F2831;
    --line:     #28323B;
    --text:     #EEF2F5;
    --muted:    #7E8C99;
    --amber:    #F5A63A;
    --amber-lo: #B8781F;
    --rail: 152px;
    --bar: 104px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(120% 90% at 78% 8%, var(--ink-2) 0%, var(--ink) 62%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;
    grid-template-columns:var(--rail) 1fr;
    grid-template-rows:1fr var(--bar);
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none;
  }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .eyebrow{
    font-size:9.5px; font-weight:800; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted);
  }

  /* ------------------------------ Rail ------------------------------ */
  #rail{
    grid-row:1; grid-column:1;
    border-right:1px solid var(--line);
    display:grid; grid-template-rows:1fr 1fr; gap:1px; background:var(--line);
  }
  .launch{
    background:var(--panel);
    display:flex; flex-direction:column; justify-content:center; gap:12px;
    padding:0 22px; text-align:left; position:relative;
    transition:background .12s ease;
  }
  .launch:active{ background:var(--panel-hi); }
  .launch .ico{ width:34px; height:34px; }
  .launch .ico svg{ width:100%; height:100%; }
  .launch .name{ font-size:22px; font-weight:750; letter-spacing:-.02em; }
  .launch .sub{ margin-top:-6px; }
  #btn-maps .ico svg{ fill:none; stroke:var(--amber); stroke-width:2; }
  #btn-spotify .ico svg{ fill:var(--amber); }

  /* ----------------------------- Inhalt ----------------------------- */
  #content{
    grid-row:1; grid-column:2;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px 20px 20px; position:relative;
  }
  #head{ display:flex; align-items:center; gap:13px; margin-bottom:14px; min-height:30px; }
  #back{
    display:none; align-items:center; justify-content:center;
    width:38px; height:38px; flex:0 0 38px;
    border:1px solid var(--line); border-radius:11px; font-size:20px; line-height:1;
  }
  #back:active{ background:var(--panel); }
  #back.on{ display:flex; }
  #title{ font-size:15px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }

  .grid{ display:grid; gap:13px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .card{
    background:var(--panel); border-radius:12px; overflow:hidden;
    text-align:left; display:flex; flex-direction:column; transition:transform .1s ease;
  }
  .card:active{ transform:scale(.96); }
  .card img{ width:100%; aspect-ratio:1; object-fit:cover; background:var(--panel-hi); display:block; }
  .card .t{
    padding:9px 11px 11px; font-size:13.5px; font-weight:650; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .row{
    display:flex; align-items:center; gap:14px; width:100%;
    min-height:62px; padding:9px 14px; border-radius:12px; text-align:left;
    transition:background .1s ease;
  }
  .row+.row{ margin-top:2px; }
  .row:active{ background:var(--panel); }
  .row .n{ width:24px; flex:0 0 24px; color:var(--muted); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; text-align:center; }
  .row .meta{ min-width:0; }
  .row .tt{ font-size:16.5px; font-weight:650; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .ta{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .row.playing{ background:rgba(245,166,58,.08); }
  .row.playing .tt{ color:var(--amber); }
  .row.playing .n{ color:var(--amber); }

  /* --------------------------- Transport ---------------------------- */
  #bar{
    grid-row:2; grid-column:1 / -1;
    border-top:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel) 0%,#12181D 100%);
    display:grid; grid-template-columns:1fr auto auto; align-items:center;
    gap:20px; padding:0 22px; position:relative;
  }
  #progress-track{ position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--line); }
  #progress{ position:absolute; left:0; bottom:0; height:3px; width:0;
    background:var(--amber); box-shadow:0 0 10px 1px rgba(245,166,58,.55); transition:width 1s linear; }

  #np{ display:flex; align-items:center; gap:15px; min-width:0; }
  #np-art{ width:66px; height:66px; flex:0 0 66px; border-radius:9px; background:var(--panel-hi);
    object-fit:cover; box-shadow:0 6px 18px rgba(0,0,0,.45); }
  #np .txt{ min-width:0; }
  #np .title{ font-size:22px; font-weight:800; letter-spacing:-.025em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
  #np .artist{ font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }

  #transport{ display:flex; align-items:center; gap:6px; }
  .tbtn{ width:66px; height:66px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background .1s ease; }
  .tbtn:active{ background:var(--panel-hi); }
  .tbtn svg{ width:28px; height:28px; fill:var(--text); }
  #play{ width:78px; height:78px; background:var(--amber);
    box-shadow:0 0 24px 2px rgba(245,166,58,.4), inset 0 1px 0 rgba(255,255,255,.25); }
  #play:active{ background:#e0952e; }
  #play svg{ width:34px; height:34px; fill:#0C0F13; }

  #shuffle{ width:66px; height:66px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); transition:all .12s ease; }
  #shuffle svg{ width:25px; height:25px; fill:var(--muted); }
  #shuffle.on{ border-color:var(--amber); background:rgba(245,166,58,.1); }
  #shuffle.on svg{ fill:var(--amber); }

  /* ----------------------------- Zustände --------------------------- */
  .empty{ color:var(--muted); font-size:15px; padding:22px 4px; line-height:1.6; }
  .playall{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
    margin:0 0 12px; background:var(--amber); color:#0C0F13; font-size:16px; font-weight:800;
    letter-spacing:-.01em; padding:15px 30px; border-radius:13px;
    box-shadow:0 0 22px 1px rgba(245,166,58,.32); }
  .playall svg{ width:20px; height:20px; fill:#0C0F13; }
  .playall:active{ background:#e0952e; }
  #notice{
    position:fixed; left:50%; bottom:calc(var(--bar) + 18px); transform:translateX(-50%);
    background:var(--panel-hi); border:1px solid var(--line); padding:11px 20px;
    border-radius:12px; font-size:14.5px; max-width:70vw; text-align:center; display:none; z-index:20;
  }
  #notice.on{ display:block; }
  #gate{
    position:fixed; inset:0; z-index:30;
    background:radial-gradient(120% 90% at 78% 8%, var(--ink-2) 0%, var(--ink) 62%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:40px; text-align:center;
  }
  #gate .badge{ font-size:11px; font-weight:800; letter-spacing:.24em; text-transform:uppercase; color:var(--amber); }
  #gate h2{ font-size:30px; font-weight:850; letter-spacing:-.03em; }
  #gate p{ color:var(--muted); font-size:15px; max-width:440px; line-height:1.55; }
  #login{ background:var(--amber); color:#0C0F13; font-size:18px; font-weight:800; letter-spacing:-.01em;
    padding:17px 42px; border-radius:14px; box-shadow:0 0 30px 2px rgba(245,166,58,.35); }
  .hidden{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<nav id="rail">
  <button class="launch" id="btn-maps" data-app="comgooglemaps://" data-web="https://www.google.com/maps">
    <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle cx="12" cy="9" r="2.6"/></svg></span>
    <span class="name">Maps</span>
    <span class="eyebrow sub">Navigation</span>
  </button>
  <button class="launch" id="btn-spotify" data-app="spotify://" data-web="https://open.spotify.com">
    <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.6 14.4a.62.62 0 01-.86.21c-2.35-1.44-5.3-1.76-8.79-.96a.62.62 0 11-.28-1.22c3.81-.87 7.08-.5 9.72 1.11.3.18.39.57.21.86zm1.23-2.74a.78.78 0 01-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 11-.45-1.49c3.63-1.1 8.15-.56 11.24 1.33.36.22.48.7.25 1.07zm.11-2.85C14.83 8.96 9.4 8.78 6.3 9.72a.94.94 0 11-.54-1.8c3.56-1.08 9.56-.87 13.33 1.37a.94.94 0 01-.96 1.61z"/></svg></span>
    <span class="name">Spotify</span>
    <span class="eyebrow sub">App öffnen</span>
  </button>
</nav>

<main id="content">
  <div id="head">
    <button id="back" aria-label="Zurück">‹</button>
    <span id="title">Playlists</span>
  </div>
  <div id="view"><p class="empty">Wird geladen …</p></div>
</main>

<footer id="bar">
  <div id="np">
    <img id="np-art" alt="">
    <div class="txt">
      <div class="title" id="np-title">Nichts läuft</div>
      <div class="artist" id="np-artist">Playlist antippen</div>
    </div>
  </div>
  <div id="transport">
    <button class="tbtn" id="prev" aria-label="Vorheriger Titel"><svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="tbtn" id="play" aria-label="Abspielen"><svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="tbtn" id="next" aria-label="Nächster Titel"><svg viewBox="0 0 24 24"><path d="M18 6h-2.5v12H18zM4 6v12L14.5 12z"/></svg></button>
  </div>
  <button id="shuffle" aria-label="Zufallswiedergabe"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-2.1 2.6-1.6-2 2.7-3.3H17V3zM3 7h3.9l2.2 2.7-1.6 2L5.9 9.6H3V7zm14 6l4 4-4 4v-3h-3.1l-2.6-3.2 1.6-2 2.1 2.6H17v-2.4zM3 15h2.9l6.1-7.4 1.6 2L6.9 18H3v-3z"/></svg></button>
  <div id="progress-track"></div>
  <div id="progress"></div>
</footer>

<div id="notice"></div>

<div id="gate">
  <span class="badge">Nachtfahrt</span>
  <h2>Auto</h2>
  <p>Steuert Spotify auf diesem iPhone. Die Musik läuft in der Spotify-App weiter — hier ist nur die Bedienung, im Querformat.</p>
  <button id="login">Mit Spotify verbinden</button>
</div>

<script>
/* ================================================================
   Client-ID bereits eingesetzt. Bei Bedarf hier ändern.
   ================================================================ */
const CLIENT_ID = "3da993026fe44f8998867b41c35f0879";

const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = [
  "user-read-playback-state","user-modify-playback-state",
  "user-read-currently-playing","playlist-read-private","playlist-read-collaborative"
].join(" ");

const $ = id => document.getElementById(id);
const store = {
  get: k => localStorage.getItem("auto." + k),
  set: (k,v) => localStorage.setItem("auto." + k, v),
  del: k => localStorage.removeItem("auto." + k)
};

let deviceId = null;
let state = { playing:false, shuffle:false, trackId:null, ms:0, dur:1 };
let pollTimer = null;

/* ---------------------------- PKCE ---------------------------- */
function randomString(len){
  const a = new Uint8Array(len); crypto.getRandomValues(a);
  return Array.from(a, b => ("0"+b.toString(16)).slice(-2)).join("").slice(0,len);
}
async function challengeFrom(v){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const v = randomString(96);
  sessionStorage.setItem("auto.verifier", v);
  const p = new URLSearchParams({
    client_id:CLIENT_ID, response_type:"code", redirect_uri:REDIRECT_URI,
    code_challenge_method:"S256", code_challenge:await challengeFrom(v), scope:SCOPES
  });
  location.href = "https://accounts.spotify.com/authorize?" + p;
}
async function exchange(code){
  const v = sessionStorage.getItem("auto.verifier");
  const res = await fetch("https://accounts.spotify.com/api/token",{
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({ client_id:CLIENT_ID, grant_type:"authorization_code", code, redirect_uri:REDIRECT_URI, code_verifier:v })
  });
  if(!res.ok) throw new Error("Anmeldung fehlgeschlagen");
  saveTokens(await res.json());
  sessionStorage.removeItem("auto.verifier");
}
async function refresh(){
  const rt = store.get("refresh");
  if(!rt) return false;
  const res = await fetch("https://accounts.spotify.com/api/token",{
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({ client_id:CLIENT_ID, grant_type:"refresh_token", refresh_token:rt })
  });
  if(!res.ok){ store.del("refresh"); store.del("access"); return false; }
  saveTokens(await res.json());
  return true;
}
function saveTokens(t){
  store.set("access", t.access_token);
  store.set("expires", Date.now() + (t.expires_in - 60)*1000);
  if(t.refresh_token) store.set("refresh", t.refresh_token);
}
async function token(){
  if(Date.now() > Number(store.get("expires")||0)){ if(!(await refresh())) return null; }
  return store.get("access");
}

/* ----------------------------- API ----------------------------- */
async function api(path, options = {}){
  const t = await token();
  if(!t){ showGate(); throw new Error("nicht angemeldet"); }
  const res = await fetch("https://api.spotify.com/v1" + path, {
    ...options,
    headers:{ Authorization:"Bearer "+t, "Content-Type":"application/json", ...(options.headers||{}) }
  });
  if(res.status === 401){ if(await refresh()) return api(path, options); showGate(); throw new Error("Sitzung abgelaufen"); }
  if(res.status === 403){ const e = new Error("Von Spotify für Dritt-Apps gesperrt"); e.status = 403; throw e; }
  if(res.status === 404) throw new Error("Kein aktives Gerät — Spotify kurz öffnen und einen Titel starten");
  if(res.status === 429) throw new Error("Zu viele Anfragen, kurz warten");
  if(res.status === 204 || res.status === 202) return null;
  if(!res.ok) throw new Error("Spotify antwortet nicht (" + res.status + ")");
  const body = await res.text();
  if(!body) return null;
  try { return JSON.parse(body); } catch { return null; }   // nie am Antworttext ersticken
}

/* -------------------------- Anzeigen --------------------------- */
let noticeTimer = null;
function notice(msg){
  const n = $("notice"); n.textContent = msg; n.classList.add("on");
  clearTimeout(noticeTimer); noticeTimer = setTimeout(()=>n.classList.remove("on"), 4500);
}
function showGate(){ $("gate").classList.remove("hidden"); }
function hideGate(){ $("gate").classList.add("hidden"); }

async function loadPlaylists(){
  $("back").classList.remove("on");
  $("title").textContent = "Playlists";
  try{
    const data = await api("/me/playlists?limit=50");
    const items = (data?.items || []).filter(Boolean);
    if(!items.length){ $("view").innerHTML = '<p class="empty">Keine Playlists gefunden. Leg in Spotify eine an, dann steht sie hier.</p>'; return; }
    $("view").innerHTML = '<div class="grid">' + items.map(p => `
      <button class="card" data-uri="${p.uri}" data-id="${p.id}" data-name="${escapeHtml(p.name)}">
        <img src="${p.images?.[0]?.url || ""}" alt="" loading="lazy">
        <span class="t">${escapeHtml(p.name)}</span>
      </button>`).join("") + "</div>";
    $("view").querySelectorAll(".card").forEach(c => c.onclick = () => openPlaylist(c.dataset.id, c.dataset.uri, c.dataset.name));
  }catch(e){ $("view").innerHTML = `<p class="empty">${escapeHtml(e.message)}</p>`; }
}

async function openPlaylist(id, uri, name){
  $("back").classList.add("on");
  $("title").textContent = name;
  $("view").innerHTML = '<p class="empty">Titel werden geladen …</p>';
  try{
    const data = await api(`/playlists/${id}/items?limit=100`);
    const tracks = (data?.items || []).map(i => i.track).filter(t => t && t.id);
    if(!tracks.length){ $("view").innerHTML = '<p class="empty">Diese Playlist ist leer.</p>'; return; }
    $("view").innerHTML =
      '<button class="playall" id="playall"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Playlist abspielen</button>' +
      tracks.map((t,i) => `
      <button class="row" data-pos="${i}" data-track="${t.id}">
        <span class="n">${i+1}</span>
        <span class="meta">
          <span class="tt">${escapeHtml(t.name)}</span>
          <span class="ta">${escapeHtml((t.artists||[]).map(a=>a.name).join(", "))}</span>
        </span>
      </button>`).join("");
    $("playall").onclick = () => playContext(uri, 0);
    $("view").querySelectorAll(".row").forEach(r => r.onclick = () => playContext(uri, Number(r.dataset.pos)));
    markPlayingRow();
  }catch(e){
    if(e.status === 403){
      // Spotify sperrt das Auslesen eigener/algorithmischer Playlists (Nov 2024) — Abspielen geht aber.
      $("view").innerHTML =
        '<p class="empty">Diese Playlist gehört nicht Dir — sie ist von Spotify erstellt oder von jemand anderem. Die Titel gibt Spotify für Dritt-Apps nur bei eigenen Playlists frei. Abspielen als Ganzes klappt trotzdem.</p>' +
        '<button class="playall" id="playall">Playlist abspielen</button>';
      $("playall").onclick = () => playContext(uri, 0);
    } else {
      $("view").innerHTML = `<p class="empty">${escapeHtml(e.message)}</p>`;
    }
  }
}

function markPlayingRow(){
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("playing", r.dataset.track === state.trackId));
}

/* -------------------------- Steuerung -------------------------- */
async function ensureDevice(){
  const data = await api("/me/player/devices");
  const devices = data?.devices || [];
  if(!devices.length) throw new Error("Spotify ist nicht erreichbar — einmal öffnen und einen Titel starten");
  const active = devices.find(d => d.is_active) || devices.find(d => d.type === "Smartphone") || devices[0];
  deviceId = active.id;
  return deviceId;
}
async function playContext(uri, position){
  try{
    await ensureDevice();
    await api(`/me/player/shuffle?state=${state.shuffle}&device_id=${deviceId}`, { method:"PUT" });
    await api(`/me/player/play?device_id=${deviceId}`, { method:"PUT", body:JSON.stringify({ context_uri:uri, offset:{ position }, position_ms:0 }) });
    setTimeout(poll, 400);
  }catch(e){ notice(e.message); }
}
async function toggle(){
  try{
    await ensureDevice();
    await api(`/me/player/${state.playing ? "pause" : "play"}?device_id=${deviceId}`, { method:"PUT" });
    setTimeout(poll, 400);
  }catch(e){ notice(e.message); }
}
async function skip(dir){
  try{ await ensureDevice(); await api(`/me/player/${dir}?device_id=${deviceId}`, { method:"POST" }); setTimeout(poll, 600); }
  catch(e){ notice(e.message); }
}
async function toggleShuffle(){
  const next = !state.shuffle;
  try{ await ensureDevice(); await api(`/me/player/shuffle?state=${next}&device_id=${deviceId}`, { method:"PUT" }); state.shuffle = next; $("shuffle").classList.toggle("on", next); }
  catch(e){ notice(e.message); }
}

/* ---------------------- Zustand abfragen ----------------------- */
async function poll(){
  try{
    const p = await api("/me/player");
    if(!p || !p.item){
      $("np-title").textContent = "Nichts läuft"; $("np-artist").textContent = "Playlist antippen";
      $("np-art").removeAttribute("src"); $("progress").style.width = "0"; setPlayIcon(false); return;
    }
    state.playing = p.is_playing; state.shuffle = p.shuffle_state; state.trackId = p.item.id;
    state.ms = p.progress_ms || 0; state.dur = p.item.duration_ms || 1;
    if(p.device?.id) deviceId = p.device.id;
    $("np-title").textContent = p.item.name;
    $("np-artist").textContent = p.item.artists.map(a=>a.name).join(", ");
    const art = p.item.album?.images?.slice(-1)[0]?.url; if(art) $("np-art").src = art;
    $("progress").style.width = (state.ms/state.dur*100) + "%";
    $("shuffle").classList.toggle("on", state.shuffle);
    setPlayIcon(state.playing); markPlayingRow();
  }catch(e){ /* still: Leiste bleibt einfach stehen */ }
}
function setPlayIcon(playing){
  $("play-icon").innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $("play").setAttribute("aria-label", playing ? "Pause" : "Abspielen");
}

/* --------------------- Display wachhalten ---------------------- */
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; }); } }
  catch(e){ /* iOS verweigert das gelegentlich */ }
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ keepAwake(); poll(); } });

/* ----------------------------- Start ---------------------------- */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

$("login").onclick = () => login();
$("back").onclick = () => loadPlaylists();
$("play").onclick = () => { keepAwake(); toggle(); };
$("prev").onclick = () => skip("previous");
$("next").onclick = () => skip("next");
$("shuffle").onclick = () => toggleShuffle();

document.querySelectorAll(".launch").forEach(b => {
  b.onclick = () => {
    const started = Date.now();
    location.href = b.dataset.app;
    setTimeout(() => { if(document.visibilityState === "visible" && Date.now() - started < 2000) location.href = b.dataset.web; }, 1200);
  };
});

async function start(){
  const params = new URLSearchParams(location.search);
  if(params.get("error")){ history.replaceState({}, "", REDIRECT_URI); showGate(); notice("Anmeldung abgebrochen"); return; }
  if(params.get("code")){
    try{ await exchange(params.get("code")); history.replaceState({}, "", REDIRECT_URI); }
    catch(e){ history.replaceState({}, "", REDIRECT_URI); showGate(); notice(e.message); return; }
  }
  if(!(await token())){ showGate(); return; }
  hideGate(); keepAwake();
  await loadPlaylists(); await poll();
  pollTimer = setInterval(poll, 3000);
}
start();
</script>
