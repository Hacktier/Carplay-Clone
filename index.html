<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Auto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto">
<meta name="theme-color" content="#0E1216">
<link rel="manifest" href="manifest.json">
<style>
  /* ---------------------------------------------------------------
     Palette: Instrumententafel bei Nacht.
     Graphit-Panel, Natriumdampf-Bernstein als einzige Leuchtfarbe.
     --------------------------------------------------------------- */
  :root{
    --ink:      #0E1216;
    --panel:    #171D23;
    --panel-hi: #1F272F;
    --line:     #2A343D;
    --text:     #E8EDF1;
    --muted:    #8A99A6;
    --amber:    #F2A03D;
    --rail: 196px;
    --bar: 116px;
    --sat: env(safe-area-inset-top);
    --sab: env(safe-area-inset-bottom);
    --sal: env(safe-area-inset-left);
    --sar: env(safe-area-inset-right);
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; overflow:hidden; }

  body{
    background:var(--ink);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    display:grid;
    grid-template-columns:var(--rail) 1fr;
    grid-template-rows:1fr var(--bar);
    height:100dvh;
    padding:var(--sat) var(--sar) var(--sab) var(--sal);
    user-select:none;
  }

  /* Mikro-Label: das einzige Schriftmotiv, das sich wiederholt. */
  .eyebrow{
    font-size:10px; font-weight:700; letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted);
  }

  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

  /* ------------------------------ Rail ------------------------------ */
  #rail{
    grid-row:1; grid-column:1;
    border-right:1px solid var(--line);
    display:grid; grid-template-rows:repeat(4,1fr); gap:1px;
    background:var(--line);
  }
  .launch{
    background:var(--panel);
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    padding:0 20px; text-align:left;
    transition:background .12s ease;
  }
  .launch:active{ background:var(--panel-hi); }
  .launch .name{ font-size:19px; font-weight:650; letter-spacing:-.01em; }

  /* ----------------------------- Inhalt ----------------------------- */
  #content{
    grid-row:1; grid-column:2;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:18px 20px 24px;
  }

  #head{
    display:flex; align-items:center; gap:14px;
    margin-bottom:16px; min-height:34px;
  }
  #head h1{ font-size:22px; font-weight:700; letter-spacing:-.02em; }
  #back{
    display:none; align-items:center; justify-content:center;
    width:34px; height:34px; flex:0 0 34px;
    border:1px solid var(--line); border-radius:10px; font-size:17px;
  }
  #back.on{ display:flex; }

  .grid{
    display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill, minmax(168px,1fr));
  }
  .card{
    background:var(--panel); border-radius:14px; overflow:hidden;
    text-align:left; display:flex; flex-direction:column;
    transition:transform .1s ease;
  }
  .card:active{ transform:scale(.97); }
  .card img{ width:100%; aspect-ratio:1; object-fit:cover; background:var(--panel-hi); display:block; }
  .card .t{
    padding:10px 12px 12px; font-size:14px; font-weight:600; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  .row{
    display:flex; align-items:center; gap:14px; width:100%;
    min-height:66px; padding:8px 12px;
    border-bottom:1px solid var(--line); text-align:left;
  }
  .row:active{ background:var(--panel); }
  .row .n{ width:26px; flex:0 0 26px; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .row .meta{ min-width:0; }
  .row .tt{ font-size:16px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .ta{ font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row.playing .tt{ color:var(--amber); }

  /* --------------------------- Statusleiste -------------------------- */
  #bar{
    grid-row:2; grid-column:1 / -1;
    border-top:1px solid var(--line); background:var(--panel);
    display:grid; grid-template-columns:1fr auto auto; align-items:center;
    gap:18px; padding:0 20px; position:relative;
  }
  /* Signatur: die Fortschrittslinie liegt als Tankanzeige unter der ganzen Leiste. */
  #progress{
    position:absolute; left:0; bottom:0; height:3px;
    background:var(--amber); width:0; transition:width 1s linear;
  }

  #np{ display:flex; align-items:center; gap:14px; min-width:0; }
  #np img{ width:64px; height:64px; flex:0 0 64px; border-radius:8px; background:var(--panel-hi); object-fit:cover; }
  #np .txt{ min-width:0; }
  #np .title{ font-size:20px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #np .artist{ font-size:14px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #transport{ display:flex; align-items:center; gap:8px; }
  .tbtn{
    width:74px; height:74px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .tbtn:active{ background:var(--panel-hi); }
  .tbtn svg{ width:30px; height:30px; fill:var(--text); }
  #play{ background:var(--amber); }
  #play:active{ background:#d98a2c; }
  #play svg{ fill:#0E1216; width:34px; height:34px; }

  #shuffle{
    width:74px; height:74px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
  }
  #shuffle svg{ width:26px; height:26px; fill:var(--muted); }
  #shuffle.on{ border-color:var(--amber); }
  #shuffle.on svg{ fill:var(--amber); }

  /* ----------------------------- Zustände ---------------------------- */
  #notice{
    position:fixed; left:50%; bottom:calc(var(--bar) + 20px + var(--sab));
    transform:translateX(-50%);
    background:var(--panel-hi); border:1px solid var(--line);
    padding:12px 20px; border-radius:12px; font-size:15px;
    max-width:80vw; text-align:center; display:none; z-index:20;
  }
  #notice.on{ display:block; }

  #gate{
    position:fixed; inset:0; background:var(--ink); z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    padding:40px; text-align:center;
  }
  #gate h2{ font-size:26px; font-weight:700; letter-spacing:-.02em; }
  #gate p{ color:var(--muted); font-size:15px; max-width:420px; line-height:1.5; }
  #login{
    background:var(--amber); color:#0E1216; font-size:18px; font-weight:700;
    padding:18px 40px; border-radius:14px;
  }
  .hidden{ display:none !important; }

  .empty{ color:var(--muted); font-size:15px; padding:24px 0; line-height:1.6; }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<nav id="rail">
  <button class="launch" data-app="comgooglemaps://" data-web="https://www.google.com/maps">
    <span class="eyebrow">Navigation</span><span class="name">Maps</span>
  </button>
  <button class="launch" data-app="whatsapp://" data-web="https://web.whatsapp.com">
    <span class="eyebrow">Nachrichten</span><span class="name">WhatsApp</span>
  </button>
  <button class="launch" data-app="audible://" data-web="https://www.audible.de">
    <span class="eyebrow">Hörbuch</span><span class="name">Audible</span>
  </button>
  <button class="launch" data-app="spotify://" data-web="https://open.spotify.com">
    <span class="eyebrow">App öffnen</span><span class="name">Spotify</span>
  </button>
</nav>

<main id="content">
  <div id="head">
    <button id="back" aria-label="Zurück">‹</button>
    <h1 id="title">Playlists</h1>
  </div>
  <div id="view"><p class="empty">Wird geladen …</p></div>
</main>

<footer id="bar">
  <div id="np">
    <img id="np-art" alt="">
    <div class="txt">
      <div class="title" id="np-title">Nichts läuft</div>
      <div class="artist" id="np-artist">Playlist antippen</div>
    </div>
  </div>

  <div id="transport">
    <button class="tbtn" id="prev" aria-label="Vorheriger Titel">
      <svg viewBox="0 0 24 24"><path d="M6 6h2.5v12H6zM20 6v12L9.5 12z"/></svg>
    </button>
    <button class="tbtn" id="play" aria-label="Abspielen">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="tbtn" id="next" aria-label="Nächster Titel">
      <svg viewBox="0 0 24 24"><path d="M18 6h-2.5v12H18zM4 6v12L14.5 12z"/></svg>
    </button>
  </div>

  <button id="shuffle" aria-label="Zufallswiedergabe">
    <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-2.1 2.6-1.6-2 2.7-3.3H17V3zM3 7h3.9l2.2 2.7-1.6 2L5.9 9.6H3V7zm14 6l4 4-4 4v-3h-3.1l-2.6-3.2 1.6-2 2.1 2.6H17v-2.4zM3 15h2.9l6.1-7.4 1.6 2L6.9 18H3v-3z"/></svg>
  </button>

  <div id="progress"></div>
</footer>

<div id="notice"></div>

<div id="gate">
  <h2>Auto</h2>
  <p>Steuert Spotify auf diesem iPhone. Die Musik läuft weiter in der Spotify-App — hier siehst du nur die Bedienung, im Querformat.</p>
  <button id="login">Mit Spotify verbinden</button>
</div>

<script>
/* ================================================================
   KONFIGURATION — hier deine Client-ID eintragen.
   ================================================================ */
const CLIENT_ID = "HIER_DEINE_CLIENT_ID";

const REDIRECT_URI = location.origin + location.pathname;
const SCOPES = [
  "user-read-playback-state",
  "user-modify-playback-state",
  "user-read-currently-playing",
  "playlist-read-private",
  "playlist-read-collaborative"
].join(" ");

const $ = id => document.getElementById(id);
const store = {
  get: k => localStorage.getItem("auto." + k),
  set: (k, v) => localStorage.setItem("auto." + k, v),
  del: k => localStorage.removeItem("auto." + k)
};

let deviceId = null;
let state = { playing:false, shuffle:false, trackId:null, ms:0, dur:0 };
let currentPlaylist = null;
let pollTimer = null;

/* ---------------------------- PKCE ---------------------------- */
function randomString(len){
  const a = new Uint8Array(len);
  crypto.getRandomValues(a);
  return Array.from(a, b => ("0" + b.toString(16)).slice(-2)).join("").slice(0, len);
}

async function challengeFrom(verifier){
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function login(){
  const verifier = randomString(96);
  sessionStorage.setItem("auto.verifier", verifier);
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256",
    code_challenge: await challengeFrom(verifier),
    scope: SCOPES
  });
  location.href = "https://accounts.spotify.com/authorize?" + params;
}

async function exchange(code){
  const verifier = sessionStorage.getItem("auto.verifier");
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: "authorization_code",
      code,
      redirect_uri: REDIRECT_URI,
      code_verifier: verifier
    })
  });
  if(!res.ok) throw new Error("Anmeldung fehlgeschlagen");
  saveTokens(await res.json());
  sessionStorage.removeItem("auto.verifier");
}

async function refresh(){
  const rt = store.get("refresh");
  if(!rt) return false;
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      client_id: CLIENT_ID,
      grant_type: "refresh_token",
      refresh_token: rt
    })
  });
  if(!res.ok){ store.del("refresh"); store.del("access"); return false; }
  saveTokens(await res.json());
  return true;
}

function saveTokens(t){
  store.set("access", t.access_token);
  store.set("expires", Date.now() + (t.expires_in - 60) * 1000);
  if(t.refresh_token) store.set("refresh", t.refresh_token);
}

async function token(){
  if(Date.now() > Number(store.get("expires") || 0)){
    if(!(await refresh())) return null;
  }
  return store.get("access");
}

/* ----------------------------- API ----------------------------- */
async function api(path, options = {}){
  const t = await token();
  if(!t){ showGate(); throw new Error("nicht angemeldet"); }

  const res = await fetch("https://api.spotify.com/v1" + path, {
    ...options,
    headers: { Authorization: "Bearer " + t, "Content-Type": "application/json", ...(options.headers || {}) }
  });

  if(res.status === 401){
    if(await refresh()) return api(path, options);
    showGate();
    throw new Error("Sitzung abgelaufen");
  }
  if(res.status === 403) throw new Error("Von Spotify abgelehnt — Premium aktiv?");
  if(res.status === 404) throw new Error("Kein aktives Gerät — Spotify-App kurz öffnen und einen Titel starten");
  if(res.status === 429) throw new Error("Zu viele Anfragen, kurz warten");
  if(res.status === 204) return null;
  if(!res.ok) throw new Error("Spotify antwortet nicht (" + res.status + ")");

  const body = await res.text();
  return body ? JSON.parse(body) : null;
}

/* -------------------------- Anzeigen --------------------------- */
let noticeTimer = null;
function notice(msg){
  const n = $("notice");
  n.textContent = msg;
  n.classList.add("on");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => n.classList.remove("on"), 4500);
}

function showGate(){ $("gate").classList.remove("hidden"); }
function hideGate(){ $("gate").classList.add("hidden"); }

async function loadPlaylists(){
  currentPlaylist = null;
  $("back").classList.remove("on");
  $("title").textContent = "Playlists";
  try{
    const data = await api("/me/playlists?limit=50");
    const items = data.items.filter(Boolean);
    if(!items.length){
      $("view").innerHTML = '<p class="empty">Keine Playlists gefunden. Leg in Spotify eine an, dann taucht sie hier auf.</p>';
      return;
    }
    $("view").innerHTML = '<div class="grid">' + items.map(p => `
      <button class="card" data-uri="${p.uri}" data-id="${p.id}" data-name="${escapeAttr(p.name)}">
        <img src="${p.images?.[0]?.url || ""}" alt="">
        <span class="t">${escapeHtml(p.name)}</span>
      </button>`).join("") + "</div>";

    $("view").querySelectorAll(".card").forEach(c => {
      c.onclick = () => openPlaylist(c.dataset.id, c.dataset.uri, c.dataset.name);
    });
  }catch(e){ $("view").innerHTML = `<p class="empty">${escapeHtml(e.message)}</p>`; }
}

async function openPlaylist(id, uri, name){
  currentPlaylist = { id, uri, name };
  $("back").classList.add("on");
  $("title").textContent = name;
  $("view").innerHTML = '<p class="empty">Titel werden geladen …</p>';
  try{
    const data = await api(`/playlists/${id}/tracks?limit=100&fields=items(track(id,name,duration_ms,artists(name)))`);
    const tracks = data.items.map(i => i.track).filter(t => t && t.id);
    if(!tracks.length){
      $("view").innerHTML = '<p class="empty">Diese Playlist ist leer.</p>';
      return;
    }
    $("view").innerHTML = tracks.map((t, i) => `
      <button class="row" data-pos="${i}" data-track="${t.id}">
        <span class="n">${i + 1}</span>
        <span class="meta">
          <span class="tt">${escapeHtml(t.name)}</span>
          <span class="ta">${escapeHtml(t.artists.map(a => a.name).join(", "))}</span>
        </span>
      </button>`).join("");

    $("view").querySelectorAll(".row").forEach(r => {
      r.onclick = () => playContext(uri, Number(r.dataset.pos));
    });
    markPlayingRow();
  }catch(e){ $("view").innerHTML = `<p class="empty">${escapeHtml(e.message)}</p>`; }
}

function markPlayingRow(){
  document.querySelectorAll(".row").forEach(r => {
    r.classList.toggle("playing", r.dataset.track === state.trackId);
  });
}

/* -------------------------- Steuerung -------------------------- */
async function ensureDevice(){
  const data = await api("/me/player/devices");
  const devices = data?.devices || [];
  if(!devices.length){
    throw new Error("Spotify-App ist nicht erreichbar — einmal öffnen und einen Titel starten");
  }
  const active = devices.find(d => d.is_active) || devices.find(d => d.type === "Smartphone") || devices[0];
  deviceId = active.id;
  return deviceId;
}

async function playContext(uri, position){
  try{
    await ensureDevice();
    await api(`/me/player/shuffle?state=${state.shuffle}&device_id=${deviceId}`, { method: "PUT" });
    await api(`/me/player/play?device_id=${deviceId}`, {
      method: "PUT",
      body: JSON.stringify({ context_uri: uri, offset: { position }, position_ms: 0 })
    });
    setTimeout(poll, 400);
  }catch(e){ notice(e.message); }
}

async function toggle(){
  try{
    await ensureDevice();
    if(state.playing){
      await api(`/me/player/pause?device_id=${deviceId}`, { method: "PUT" });
    }else{
      await api(`/me/player/play?device_id=${deviceId}`, { method: "PUT" });
    }
    setTimeout(poll, 400);
  }catch(e){ notice(e.message); }
}

async function skip(dir){
  try{
    await ensureDevice();
    await api(`/me/player/${dir}?device_id=${deviceId}`, { method: "POST" });
    setTimeout(poll, 600);
  }catch(e){ notice(e.message); }
}

async function toggleShuffle(){
  const next = !state.shuffle;
  try{
    await ensureDevice();
    await api(`/me/player/shuffle?state=${next}&device_id=${deviceId}`, { method: "PUT" });
    state.shuffle = next;
    $("shuffle").classList.toggle("on", next);
  }catch(e){ notice(e.message); }
}

/* ---------------------- Zustand abfragen ----------------------- */
async function poll(){
  try{
    const p = await api("/me/player");
    if(!p || !p.item){
      $("np-title").textContent = "Nichts läuft";
      $("np-artist").textContent = "Playlist antippen";
      $("np-art").removeAttribute("src");
      $("progress").style.width = "0";
      setPlayIcon(false);
      return;
    }
    state.playing = p.is_playing;
    state.shuffle = p.shuffle_state;
    state.trackId = p.item.id;
    state.ms = p.progress_ms || 0;
    state.dur = p.item.duration_ms || 1;
    if(p.device?.id) deviceId = p.device.id;

    $("np-title").textContent = p.item.name;
    $("np-artist").textContent = p.item.artists.map(a => a.name).join(", ");
    const art = p.item.album?.images?.slice(-1)[0]?.url;
    if(art) $("np-art").src = art;
    $("progress").style.width = (state.ms / state.dur * 100) + "%";
    $("shuffle").classList.toggle("on", state.shuffle);
    setPlayIcon(state.playing);
    markPlayingRow();
  }catch(e){ /* stiller Fehlschlag: die Leiste bleibt einfach stehen */ }
}

function setPlayIcon(playing){
  $("play-icon").innerHTML = playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $("play").setAttribute("aria-label", playing ? "Pause" : "Abspielen");
}

/* --------------------- Display wachhalten ---------------------- */
let wakeLock = null;
async function keepAwake(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  }catch(e){ /* iOS verweigert das gelegentlich — nicht kritisch */ }
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){ keepAwake(); poll(); }
});

/* ----------------------------- Start ---------------------------- */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function escapeAttr(s){ return escapeHtml(s); }

$("login").onclick = () => login();
$("back").onclick = () => loadPlaylists();
$("play").onclick = () => { keepAwake(); toggle(); };
$("prev").onclick = () => skip("previous");
$("next").onclick = () => skip("next");
$("shuffle").onclick = () => toggleShuffle();

document.querySelectorAll(".launch").forEach(b => {
  b.onclick = () => {
    const started = Date.now();
    location.href = b.dataset.app;
    // Wenn die App nach 1,2 s nicht übernommen hat, im Browser weiter.
    setTimeout(() => {
      if(document.visibilityState === "visible" && Date.now() - started < 2000){
        location.href = b.dataset.web;
      }
    }, 1200);
  };
});

async function start(){
  const params = new URLSearchParams(location.search);

  if(params.get("error")){
    history.replaceState({}, "", REDIRECT_URI);
    showGate();
    notice("Anmeldung abgebrochen");
    return;
  }

  if(params.get("code")){
    try{
      await exchange(params.get("code"));
      history.replaceState({}, "", REDIRECT_URI);
    }catch(e){
      history.replaceState({}, "", REDIRECT_URI);
      showGate();
      notice(e.message);
      return;
    }
  }

  if(!(await token())){ showGate(); return; }

  hideGate();
  keepAwake();
  await loadPlaylists();
  await poll();
  pollTimer = setInterval(poll, 3000);
}

start();
</script>
</body>
</html>
